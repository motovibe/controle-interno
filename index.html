<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotoVibe — Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root{
    --bg:#e4e3e0;
    --surface:#ffffff;
    --surface-2:#edece9;
    --border:#d2d1cb;
    --text:#2b2b29;
    --muted:#75756f;
    --amber:#6fa84b;
    --amber-text:#3f6b2c;
    --amber-dim:#e2eeda;
    --blue:#1751a3;
    --green:#4c8f39;
    --green-dim:#e2eeda;
    --red:#b23f2d;
    --red-dim:#fbe3dd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.num,.plate{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  /* header */
  .topbar{margin-bottom:16px;}
  .topbar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;}
  .topbar .tag{color:var(--muted);font-size:13px;margin-top:2px;}
  .btn{
    background:var(--amber);color:#1c2618;border:none;padding:10px 16px;
    border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--muted);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:6px 11px;font-size:13px;}

  /* tabs */
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;row-gap:6px;overflow-x:auto;}
  .tab-btn{background:none;border:none;color:var(--muted);padding:10px 2px;font-size:14.5px;
    font-family:'Inter',sans-serif;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--amber);font-weight:600;}
  .tab-btn:hover{color:var(--text);}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .stat .num{font-size:22px;font-weight:600;}
  .stat .label{color:var(--muted);font-size:12.5px;margin-top:2px;}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* alerts */
  .alert{
    background:var(--green-dim);border:1px solid #b9ddc4;border-radius:8px;
    padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:12px;
  }
  .alert .msg{font-size:14px;}
  .alert .msg b{color:var(--green);}

  /* grid of motos */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--muted);
    border-radius:6px;padding:16px;cursor:pointer;transition:border-color .15s;
  }
  .card:hover{border-color:#b7b3a3;}
  .card.status-ativa{border-left-color:var(--amber);}
  .card.status-disponivel{border-left-color:var(--muted);}
  .card.status-encerrada{border-left-color:var(--green);}
  .plate-badge{
    display:inline-flex;align-items:stretch;background:#e7e7e4;border-radius:4px;overflow:hidden;
    font-family:'Space Grotesk',monospace;margin-bottom:10px;border:1px solid #cfcdc2;
  }
  .plate-badge .br{background:#1751a3;color:#fff;font-size:9px;font-weight:700;padding:3px 4px;display:flex;align-items:center;letter-spacing:.5px;}
  .plate-badge .num{color:#141414;font-size:15px;font-weight:700;padding:3px 8px;letter-spacing:1.5px;}
  .card .modelo{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;font-weight:500;}
  .badge.ativa{background:var(--amber-dim);color:var(--amber-text);}
  .badge.disponivel{background:var(--surface-2);color:var(--muted);}
  .badge.encerrada{background:var(--green-dim);color:var(--green);}
  .badge-contrato-ativo{background:var(--green-dim);color:var(--green);}
  .badge-contrato-encerrado{background:var(--red-dim);color:var(--red);}
  .card .locatario{margin-top:10px;font-size:14px;}
  .progress-wrap{margin-top:10px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--amber);}
  .card .progress-label{font-size:12px;color:var(--muted);margin-top:4px;}
  .card .saldo{margin-top:12px;font-size:17px;font-weight:600;}
  .saldo.pos{color:var(--green);}
  .saldo.neg{color:var(--red);}

  /* detail */
  .back{color:var(--muted);background:none;border:none;font-size:14px;cursor:pointer;padding:0;margin-bottom:16px;font-family:'Inter',sans-serif;}
  .back:hover{color:var(--text);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:14px;}
  .section h3{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--text);}
  .section h3 .muted-small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px;}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .kv div .k{color:var(--muted);font-size:12px;}
  .kv div .v{font-size:15px;margin-top:2px;}
  .financials{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:640px){.financials{grid-template-columns:repeat(2,1fr);}}
  .fin-item .v{font-size:19px;font-weight:600;}
  .fin-item .k{color:var(--muted);font-size:12.5px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:8px;border-bottom:1px solid var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface-2);}
  td input, td select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;
    padding:4px 6px;font-size:12.5px;font-family:'Inter',sans-serif;color:var(--text);
  }
  td.val-in{color:var(--green);}
  td.val-out{color:var(--red);}
  .row-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .empty{color:var(--muted);font-size:14px;padding:10px 0;}
  .del-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;}
  .del-x:hover{color:var(--red);}
  .filter-select, input.filter-select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13.5px;font-family:'Inter',sans-serif;max-width:260px;
  }
  .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .filter-bar label{font-size:12.5px;color:var(--muted);}
  .filter-bar .filter-select{max-width:150px;}
  .period-note{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(8,9,12,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:17px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--amber);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:13px;}
  .modal-error{font-size:13px;color:var(--red);margin:-4px 0 13px;display:none;}
</style>
</head>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function brl(n){ return (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function unidade(periodicidade){
  if(periodicidade==='Diária') return 'dias';
  if(periodicidade==='Semanal') return 'semanas';
  return 'meses';
}

  return 'mensais';
}

// ---------- helpers de importação (Excel/PDF) ----------
function parseNumeroImport(v){
  if(v===null||v===undefined||v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim();
  s = s.replace(/[Rr]\$\s?/,'').replace(/\s/g,'');
  if(/,\d{1,2}$/.test(s)){ s = s.replace(/\./g,'').replace(',', '.'); }
  else { s = s.replace(/,/g,''); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseDataImport(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [,d,mo,y] = m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function normalizarPeriodicidade(v){
  const s = (v||'').toString().toLowerCase();
  if(s.includes('sem')) return 'Semanal';
  if(s.includes('dia') || s.includes('diár')) return 'Diária';
  if(s.includes('mensal') || s.includes('mês') || s.includes('mes')) return 'Mensal';
  return '';
}
function chuteColuna(headers, palavras){
  for(let i=0;i<headers.length;i++){
    const h = (headers[i]||'').toString().toLowerCase();
    if(palavras.some(p=>h.includes(p))) return i;
  }
  return -1;
}
function mapeamentoInicial(headers){
  return {
    placa: chuteColuna(headers, ['placa']),
    modelo: chuteColuna(headers, ['modelo']),

async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
}

async function parsePdfFile(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allRows = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items
      .map(it=>({str: it.str, x: it.transform[4], y: it.transform[5]}))
      .filter(it=>it.str.trim()!=='');
    const linhas = {};
    items.forEach(it=>{
      const key = Math.round(it.y/4)*4;
      if(!linhas[key]) linhas[key] = [];
      linhas[key].push(it);
    });
    const ys = Object.keys(linhas).map(Number).sort((a,b)=>b-a);
    ys.forEach(y=>{
      const itensLinha = linhas[y].slice().sort((a,b)=>a.x-b.x);
      const colunas = [];
      let atual = [itensLinha[0]];
      for(let i=1;i<itensLinha.length;i++){
        const anterior = atual[atual.length-1];
        const gap = itensLinha[i].x - (anterior.x + anterior.str.length*4.5);
        if(gap > 12){ colunas.push(atual); atual = [itensLinha[i]]; }
        else atual.push(itensLinha[i]);
      }
      colunas.push(atual);
      allRows.push(colunas.map(c=>c.map(it=>it.str).join(' ').trim()));
    });
  }
  const maxCols = Math.max(1, ...allRows.map(r=>r.length));
  return allRows.map(r=>{ const copy = r.slice(); while(copy.length<maxCols) copy.push(''); return copy; });
}

function computarPreviewImport(dados){
  const dataRows = dados.hasHeader ? dados.rows.slice(1) : dados.rows.slice();
  return dataRows
    .filter(r=>r.some(c=>String(c).trim()!==''))
    .map(r=>{
      const get = (key)=>{ const idx = dados.mapping[key]; return (idx===undefined||idx===-1) ? '' : (r[idx]!==undefined?r[idx]:''); };
      return {
        placa: String(get('placa')||'').trim().toUpperCase(),
        modelo: String(get('modelo')||'').trim(),
        dataCompra: parseDataImport(get('dataCompra')),
        precoCompra: parseNumeroImport(get('precoCompra')),
        locatario: String(get('locatario')||'').trim(),
        contato: String(get('contato')||'').trim(),
        periodicidade: normalizarPeriodicidade(get('periodicidade')),
        valorParcela: parseNumeroImport(get('valorParcela')),
        prazo: parseInt(get('prazo'))||0,
        valorTotal: parseNumeroImport(get('valorTotal')),
      };
    });
}

function mapMoto(m){ return {id:m.id, placa:m.placa, modelo:m.modelo, dataCompra:m.data_compra, precoCompra:Number(m.preco_compra)||0}; }
function mapContrato(c){ return {id:c.id, motoId:c.moto_id, locatario:c.locatario, contato:c.contato, dataInicio:c.data_inicio, periodicidade:c.periodicidade, valorParcela:Number(c.valor_parcela)||0, prazo:c.prazo, valorTotal:Number(c.valor_total)||0, status:c.status, avisoLido:c.aviso_lido, dataEncerramento:c.data_encerramento, parcelasAjuste:Number(c.parcelas_ajuste)||0}; }
function mapLancamento(l){ return {id:l.id, motoId:l.moto_id, contratoId:l.contrato_id, data:l.data, tipo:l.tipo, categoria:l.categoria, descricao:l.descricao, valor:Number(l.valor)||0}; }

async function loadState(){
  try{
    const [motosRes, contratosRes, lancRes] = await Promise.all([
      sb.from('controle_motos').select('*').order('created_at'),
      sb.from('controle_contratos').select('*').order('created_at'),
      sb.from('controle_lancamentos').select('*').order('created_at'),
    ]);
    if(motosRes.error) throw motosRes.error;
    if(contratosRes.error) throw contratosRes.error;
    if(lancRes.error) throw lancRes.error;
    state.motos = (motosRes.data||[]).map(mapMoto);
    state.contratos = (contratosRes.data||[]).map(mapContrato);
    state.lancamentos = (lancRes.data||[]).map(mapLancamento);
  }catch(e){
    console.error('Erro ao carregar do Supabase', e);
    state.loadError = e.message || 'Erro desconhecido ao conectar no Supabase.';
  }
  state.loaded = true;
  render();
}

async function criarMoto(placa, modelo, dataCompra, precoCompra){
  const {data, error} = await sb.from('controle_motos')
    .insert({placa, modelo, data_compra: dataCompra||null, preco_compra: precoCompra})
    .select().single();
  if(error) throw error;
  const novaMoto = mapMoto(data);
  state.motos.push(novaMoto);
  if(precoCompra > 0){
    const {data: lanc, error: err2} = await sb.from('controle_lancamentos')
      .insert({moto_id:novaMoto.id, contrato_id:null, data:dataCompra, tipo:'saida', categoria:'Compra da moto', descricao:'Compra da moto', valor:precoCompra})
      .select().single();
    if(err2) throw err2;
    state.lancamentos.push(mapLancamento(lanc));
  }
  return novaMoto;
}

// ---------- derived data helpers ----------
function contratoAtivo(motoId){
  return state.contratos.find(c => c.motoId===motoId && c.status==='Ativo');
}
function contratosDaMoto(motoId){
  return state.contratos.filter(c=>c.motoId===motoId).sort((a,b)=> (b.dataInicio||'').localeCompare(a.dataInicio||''));
}
function lancamentosDaMoto(motoId){
  return state.lancamentos.filter(l=>l.motoId===motoId);
}
function totalEntradas(list){ return list.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+Number(l.valor||0),0); }
function totalSaidas(list){ return list.filter(l=>l.tipo==='saida').reduce((s,l)=>s+Number(l.valor||0),0); }
function parcelasPagasBrutas(contratoId){
  return state.lancamentos.filter(l=>l.contratoId===contratoId && l.tipo==='entrada' && l.categoria==='Parcela').length;
}
function parcelasPagas(contratoId){
  const contrato = state.contratos.find(c=>c.id===contratoId);
  const ajuste = contrato ? (contrato.parcelasAjuste||0) : 0;
  return Math.max(0, parcelasPagasBrutas(contratoId) + ajuste);
}
function saldoMoto(moto){
  const l = lancamentosDaMoto(moto.id);
  return totalEntradas(l) - totalSaidas(l);
}
function statusMoto(moto){
  const c = contratoAtivo(moto.id);
  if(c) return 'ativa';
  const hist = contratosDaMoto(moto.id);
  if(hist.length>0) return 'encerrada';
  return 'disponivel';
}
function motoMatchesSearch(m, termRaw){
  const term = (termRaw||'').trim().toLowerCase();
  if(!term) return true;
  if(m.placa.toLowerCase().includes(term)) return true;
  if(m.modelo.toLowerCase().includes(term)) return true;
  return contratosDaMoto(m.id).some(c=>(c.locatario||'').toLowerCase().includes(term));
}
function historicoPagamentos(motoId){
  const contratos = contratosDaMoto(motoId);
  const entradasMoto = lancamentosDaMoto(motoId).filter(l=>l.tipo==='entrada');

  // parcelas: agrupadas por periodicidade do contrato (dias/semanas/meses)
  let parcelaCount=0, parcelaValor=0;
  const porPeriodicidade = {};
  contratos.forEach(c=>{
    const pagos = state.lancamentos.filter(l=>l.contratoId===c.id && l.tipo==='entrada' && l.categoria==='Parcela');
    const count = pagos.length;
    const valor = pagos.reduce((s,l)=>s+Number(l.valor||0),0);
    parcelaCount += count; parcelaValor += valor;
    if(!porPeriodicidade[c.periodicidade]) porPeriodicidade[c.periodicidade] = {count:0, valor:0};
    porPeriodicidade[c.periodicidade].count += count;
    porPeriodicidade[c.periodicidade].valor += valor;
  });

  // demais categorias de entrada (caução, outra receita, etc.) — direto pela moto,
  // sem depender de contrato, pra nunca ficar fora da conta
  const outrasCategorias = {};
  entradasMoto.forEach(l=>{
    if(l.categoria==='Parcela') return;
    const cat = l.categoria || 'Outra receita';
    if(!outrasCategorias[cat]) outrasCategorias[cat] = {count:0, valor:0};
    outrasCategorias[cat].count++;
    outrasCategorias[cat].valor += Number(l.valor||0);
  });

  const totalValor = totalEntradas(entradasMoto);
  const totalCount = entradasMoto.length;

  return {
    totalCount, totalValor,
    parcelaCount, parcelaValor,
    porPeriodicidade, outrasCategorias,
    temContratos: contratos.length>0, temEntradas: entradasMoto.length>0
  };
}

function recomputeContratoStatus(contrato){
  if(contrato.status!=='Ativo') return false;
  if(!contrato.prazo || contrato.prazo <= 0) return false; // prazo não definido: nunca encerra sozinho
  const pagas = parcelasPagas(contrato.id);
  if(pagas >= contrato.prazo){
    contrato.status = 'Encerrado';
    contrato.avisoLido = false;
    contrato.dataEncerramento = todayISO();
    atualizarContrato(contrato.id, {status:'Encerrado', aviso_lido:false, data_encerramento:contrato.dataEncerramento});
    return true;
  }
  return false;
}
function recomputeAll(){
  state.contratos.forEach(recomputeContratoStatus);
}

function askConfirm(message, onYes){
  view.confirm = {message, onYes};
  renderConfirm();
}
function showAlert(message){
  view.confirm = {message, onYes:null, onlyOk:true};
  renderConfirm();
}
function renderConfirm(){
  let el = document.getElementById('confirm-root');
  if(el) el.remove();
  if(!view.confirm) return;
  const wrap = document.createElement('div');
  wrap.id = 'confirm-root';
  wrap.className = 'overlay';
  wrap.style.zIndex = '60';
  const botoes = view.confirm.onlyOk
    ? `<button class="btn" id="confirm-yes">Ok</button>`
    : `<button class="btn secondary" id="confirm-no">Cancelar</button>
       <button class="btn" id="confirm-yes" style="background:var(--red);color:#fff;">Confirmar</button>`;
  wrap.innerHTML = `<div class="modal" style="max-width:360px;">
    <p style="margin:0 0 18px;font-size:14.5px;">${view.confirm.message}</p>
    <div class="modal-actions">${botoes}</div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById('confirm-no')?.addEventListener('click', ()=>{ view.confirm=null; renderConfirm(); });
  document.getElementById('confirm-yes').addEventListener('click', ()=>{
    const cb = view.confirm.onYes;
    view.confirm = null;
    renderConfirm();
    if(cb) cb();
  });
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap){ view.confirm=null; renderConfirm(); } });
}

// ---------- rendering ----------
function render(){
  const app = document.getElementById('app');
  if(!state.authChecked){ app.innerHTML = '<p style="color:var(--muted);padding:40px;text-align:center;">Carregando…</p>'; return; }
  if(!state.session){
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  if(!state.loaded){ app.innerHTML = '<p style="color:var(--muted);padding:40px;text-align:center;">Carregando…</p>'; return; }
  if(state.loadError){
    app.innerHTML = `<div style="max-width:480px;margin:60px auto;text-align:center;padding:0 20px;">
      <h2 style="margin-bottom:10px;">Não consegui carregar os dados</h2>
      <p style="color:var(--muted);">Confira se a SUPABASE_URL e a SUPABASE_ANON_KEY no início do código estão certas, e se as tabelas controle_motos, controle_contratos e controle_lancamentos existem no seu projeto Supabase.</p>
      <p style="color:var(--red);font-size:13px;margin-top:14px;">${state.loadError}</p>
    </div>`;
    return;
  }
  recomputeAll();

  const activeId = document.activeElement ? document.activeElement.id : null;
  let selStart=null, selEnd=null;
  if(activeId && document.activeElement.tagName==='INPUT'){
    selStart = document.activeElement.selectionStart;
    selEnd = document.activeElement.selectionEnd;
  }

  app.innerHTML = view.screen==='detail' ? renderDetail() : renderShell();
  renderModal();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  attachEvents();
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function sqlEsc(s){ if(s===null||s===undefined||s==='') return 'NULL'; return "'" + String(s).replace(/'/g,"''") + "'"; }
function sqlNum(n){ if(n===null||n===undefined||n==='') return '0'; return String(n); }

function baixarBackupSQL(){
  const lines = [];
  lines.push('-- Backup completo do Controle MotoVibe');
  lines.push('-- Gerado em ' + new Date().toLocaleString('pt-BR'));
  lines.push('-- Restaura preservando os IDs originais (seguro rodar de novo: ignora o que já existir).');
  lines.push('');
  state.motos.forEach(m=>{
    lines.push(`INSERT INTO controle_motos (id, placa, modelo, data_compra, preco_compra) VALUES ('${m.id}', ${sqlEsc(m.placa)}, ${sqlEsc(m.modelo)}, ${sqlEsc(m.dataCompra)}, ${sqlNum(m.precoCompra)}) ON CONFLICT (id) DO NOTHING;`);
  });
  lines.push('');
  state.contratos.forEach(c=>{
    lines.push(`INSERT INTO controle_contratos (id, moto_id, locatario, contato, data_inicio, periodicidade, valor_parcela, prazo, valor_total, status, aviso_lido, data_encerramento, parcelas_ajuste) VALUES ('${c.id}', '${c.motoId}', ${sqlEsc(c.locatario)}, ${sqlEsc(c.contato)}, ${sqlEsc(c.dataInicio)}, ${sqlEsc(c.periodicidade)}, ${sqlNum(c.valorParcela)}, ${sqlNum(c.prazo)}, ${sqlNum(c.valorTotal)}, ${sqlEsc(c.status)}, ${c.avisoLido?'true':'false'}, ${sqlEsc(c.dataEncerramento)}, ${sqlNum(c.parcelasAjuste)}) ON CONFLICT (id) DO NOTHING;`);
  });
  lines.push('');
  state.lancamentos.forEach(l=>{
    lines.push(`INSERT INTO controle_lancamentos (id, moto_id, contrato_id, data, tipo, categoria, descricao, valor) VALUES ('${l.id}', ${l.motoId?`'${l.motoId}'`:'NULL'}, ${l.contratoId?`'${l.contratoId}'`:'NULL'}, ${sqlEsc(l.data)}, ${sqlEsc(l.tipo)}, ${sqlEsc(l.categoria)}, ${sqlEsc(l.descricao)}, ${sqlNum(l.valor)}) ON CONFLICT (id) DO NOTHING;`);
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  downloadBlob(blob, `backup-motovibe-${todayISO()}.sql`);
  view.ultimoBackup = new Date().toLocaleString('pt-BR');
  render();
}

function renderImportMapeamento(dados){
  const opts = (campoKey)=>{
    const selecionado = dados.mapping[campoKey];
    let html = `<option value="-1" ${selecionado===-1?'selected':''}>(não usar)</option>`;
    dados.headers.forEach((h,i)=>{
      html += `<option value="${i}" ${selecionado===i?'selected':''}>${h || ('Coluna '+(i+1))}</option>`;
    });
    return html;
  };
  return `
    <div class="section">
      <div class="row-actions"><h3 style="margin:0;">De onde vem cada informação</h3>
        <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">

        ${CAMPOS_IMPORT.map(c=>`
          <div class="field"><label>${c.label}${c.required?' *':''}</label>

}

function renderCaixaGeral(){

  else if(filterId!=='todas') lancs = lancs.filter(l=>l.motoId===filterId);
  if(searchTerm){
    lancs = lancs.filter(l=>{
      const m = state.motos.find(mm=>mm.id===l.motoId);
      return m && m.placa.toLowerCase().includes(searchTerm);
    });
  }
  lancs.sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const entradasT = totalEntradas(lancs);

  const saldo = entradasT - saidasT;

  const options = `<option value="todas">Todas as motos</option><option value="geral">Geral (sem moto)</option>` +
    state.motos.map(m=>`<option value="${m.id}" ${filterId===m.id?'selected':''}>${m.placa} — ${m.modelo}</option>`).join('');

  const rows = lancs.map(l=>{
    const moto = state.motos.find(m=>m.id===l.motoId);
    return `<tr>
      <td>${fmtDate(l.data)}</td>

// ---------- modals ----------
function renderModal(){
  let el = document.getElementById('modal-root');
  if(el) el.remove();
  if(!view.modal) return;
  const wrap = document.createElement('div');
  wrap.id = 'modal-root';
  wrap.className = 'overlay';
  wrap.innerHTML = modalContent(view.modal);
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap){ view.modal=null; view.modalCtx=null; render(); } });
  attachModalEvents(view.modal);
}

function showModalError(msg){
  const el = document.getElementById('modal-error');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

function categoriasFor(tipo, hasMoto){
  if(hasMoto){
    return tipo==='entrada'
      ? ['Parcela','Caução','Outra receita']
      : ['Seguro','Rastreador','Manutenção','Multa','Comissão','Compra da moto','Outra despesa'];
  }
  return tipo==='entrada'
    ? ['Empréstimo','Aporte de capital','Outra receita']
    : ['Despesa administrativa','Taxas e impostos','Marketing','Outra despesa'];
}

function attachModalEvents(kind){
  document.getElementById('m-cancel')?.addEventListener('click', ()=>{ view.modal=null; view.modalCtx=null; render(); });

  if(kind==='novo-contrato' || kind==='editar-contrato'){
    const perSel = document.getElementById('f-periodicidade');
    const lbl = document.getElementById('lbl-prazo');
    function updateLabel(){
      const u = unidade(perSel.value);
      lbl.textContent = `Prazo (nº de ${u})`;
    }
    updateLabel();
    perSel.addEventListener('change', updateLabel);
  }

  if(kind==='lancamento'){
    const ctx = view.modalCtx || {};
    const tipoSel = document.getElementById('f-tipo');
    const catSel = document.getElementById('f-categoria');
    const motoSel = document.getElementById('f-moto');
    function currentMotoId(){ return ctx.allowMotoSelect ? (motoSel.value || null) : ctx.fixedMotoId; }
    function fillCats(){
      catSel.innerHTML = categoriasFor(tipoSel.value, !!currentMotoId()).map(c=>`<option>${c}</option>`).join('');
    }
    fillCats();
    tipoSel.addEventListener('change', fillCats);
    motoSel?.addEventListener('change', fillCats);
  }

  if(kind==='editar-lancamento'){
    const l = state.lancamentos.find(l=>l.id===view.modalCtx.lancamentoId);
    const tipoSel = document.getElementById('f-tipo');
    const catSel = document.getElementById('f-categoria');
    function fillCats(){
      const opts = categoriasFor(tipoSel.value, !!l.motoId);
      catSel.innerHTML = opts.map(c=>`<option ${c===l.categoria?'selected':''}>${c}</option>`).join('');
      if(!opts.includes(l.categoria) && l.categoria){
        catSel.insertAdjacentHTML('afterbegin', `<option selected>${l.categoria}</option>`);
      }
    }
    fillCats();
    tipoSel.addEventListener('change', fillCats);
  }

  document.getElementById('m-save')?.addEventListener('click', async ()=>{
    const saveBtn = document.getElementById('m-save');
    if(kind==='nova-moto'){
      const placa = document.getElementById('f-placa').value.trim().toUpperCase();
      const modelo = document.getElementById('f-modelo').value.trim();
      const dataCompra = document.getElementById('f-datacompra').value;
      const precoCompra = parseFloat(document.getElementById('f-precocompra').value)||0;
      if(!placa || !modelo){ showModalError('Preencha placa e modelo.'); return; }
      saveBtn.disabled = true;
      try{
        await criarMoto(placa, modelo, dataCompra, precoCompra);
        view.modal=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
    else if(kind==='novo-contrato'){
      const locatario = document.getElementById('f-locatario').value.trim();
      const contato = document.getElementById('f-contato').value.trim();
      const dataInicio = document.getElementById('f-inicio').value;
      const periodicidade = document.getElementById('f-periodicidade').value;
      const valorParcela = parseFloat(document.getElementById('f-parcela').value)||0;
      const prazo = parseInt(document.getElementById('f-prazo').value)||0;
      let valorTotalInput = document.getElementById('f-total').value;
      const valorTotal = valorTotalInput ? parseFloat(valorTotalInput) : (valorParcela*prazo);
      if(!locatario || !prazo || !valorParcela){ showModalError('Preencha locatário, valor da parcela e prazo.'); return; }
      saveBtn.disabled = true;
      try{
        await criarContrato(view.motoId, {locatario, contato, dataInicio, periodicidade, valorParcela, prazo, valorTotal});
        view.modal=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
    else if(kind==='editar-moto'){
      const placa = document.getElementById('f-placa').value.trim().toUpperCase();
      const modelo = document.getElementById('f-modelo').value.trim();
      const dataCompra = document.getElementById('f-datacompra').value;
      const precoCompra = parseFloat(document.getElementById('f-precocompra').value)||0;
      if(!placa || !modelo){ showModalError('Preencha placa e modelo.'); return; }
      saveBtn.disabled = true;
      try{
        await atualizarMoto(view.modalCtx.motoId, {placa, modelo, data_compra: dataCompra||null, preco_compra: precoCompra});
        view.modal=null; view.modalCtx=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
    else if(kind==='editar-contrato'){
      const locatario = document.getElementById('f-locatario').value.trim();
      const contato = document.getElementById('f-contato').value.trim();
      const dataInicio = document.getElementById('f-inicio').value;
      const periodicidade = document.getElementById('f-periodicidade').value;
      const valorParcela = parseFloat(document.getElementById('f-parcela').value)||0;
      const prazo = parseInt(document.getElementById('f-prazo').value)||0;
      const valorTotal = parseFloat(document.getElementById('f-total').value)||0;
      const parcelasPagasDesejado = parseInt(document.getElementById('f-parcelas-pagas').value);
      if(!locatario || !prazo || !valorParcela){ showModalError('Preencha locatário, valor da parcela e prazo.'); return; }
      saveBtn.disabled = true;
      try{
        const contratoId = view.modalCtx.contratoId;
        const brutas = parcelasPagasBrutas(contratoId);
        const novoAjuste = isNaN(parcelasPagasDesejado) ? 0 : (parcelasPagasDesejado - brutas);
        await atualizarContratoCampos(contratoId, {
          locatario, contato, data_inicio: dataInicio||null, periodicidade,
          valor_parcela: valorParcela, prazo, valor_total: valorTotal, parcelas_ajuste: novoAjuste
        });
        view.modal=null; view.modalCtx=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
    else if(kind==='editar-lancamento'){
      const data = document.getElementById('f-data').value;
      const tipo = document.getElementById('f-tipo').value;
      const categoria = document.getElementById('f-categoria').value;
      const descricao = document.getElementById('f-descricao').value.trim();
      const valor = parseFloat(document.getElementById('f-valor').value)||0;
      if(!valor){ showModalError('Informe o valor.'); return; }
      saveBtn.disabled = true;
      try{
        await atualizarLancamentoCampos(view.modalCtx.lancamentoId, {data, tipo, categoria, descricao: descricao || categoria, valor});
        view.modal=null; view.modalCtx=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
    else if(kind==='lancamento'){
      const ctx = view.modalCtx || {};
      const motoId = ctx.allowMotoSelect ? (document.getElementById('f-moto').value || null) : ctx.fixedMotoId;
      const data = document.getElementById('f-data').value;
      const tipo = document.getElementById('f-tipo').value;
      const categoria = document.getElementById('f-categoria').value;
      const descricao = document.getElementById('f-descricao').value.trim();
      const valor = parseFloat(document.getElementById('f-valor').value)||0;
      if(!valor){ showModalError('Informe o valor.'); return; }
      saveBtn.disabled = true;
      try{
        await criarLancamento(motoId, {data, tipo, categoria, descricao: descricao || categoria, valor});
        view.modal=null; view.modalCtx=null; render();
      }catch(err){ showModalError('Erro ao salvar: ' + err.message); saveBtn.disabled = false; }
    }
  });
}

// ---------- events ----------
function attachEvents(){
  document.getElementById('import-file')?.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    view.importErro = null; view.importDados = null; view.importPreviewRows = null; view.importando = true;
    render();
    try{
      const nome = file.name.toLowerCase();
      let rows, origem;
      if(nome.endsWith('.pdf')){
        rows = await parsePdfFile(file); origem = 'pdf';
      } else {
        rows = await parseExcelFile(file); origem = 'excel';
      }
      rows = rows.filter(r=>r.some(c=>String(c).trim()!==''));
      if(rows.length===0){ throw new Error('Não encontrei nenhuma linha com dado nesse arquivo.'); }
      const headers = rows[0].map(h=>String(h||'').trim());
      view.importDados = { headers, rows, hasHeader: true, mapping: mapeamentoInicial(headers), origem };
    }catch(err){
      view.importErro = 'Não consegui ler o arquivo: ' + err.message;
    }
    view.importando = false;
    render();
  });

  document.getElementById('import-tem-cabecalho')?.addEventListener('change', (e)=>{
    view.importDados.hasHeader = e.target.checked;
  });
  document.querySelectorAll('[data-map]').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      view.importDados.mapping[sel.getAttribute('data-map')] = parseInt(e.target.value);
    });
  });
  document.getElementById('btn-gerar-previa')?.addEventListener('click', ()=>{
    view.importPreviewRows = computarPreviewImport(view.importDados);
    render();
  });
  document.querySelectorAll('[data-prev]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const campo = el.getAttribute('data-prev');
      const i = parseInt(el.getAttribute('data-i'));
      const numericos = ['precoCompra','valorParcela','prazo','valorTotal'];
      view.importPreviewRows[i][campo] = numericos.includes(campo) ? (parseFloat(el.value)||0) : el.value;
    });
  });
  document.querySelectorAll('[data-del-preview]').forEach(el=>{
    el.addEventListener('click', ()=>{
      view.importPreviewRows.splice(parseInt(el.getAttribute('data-del-preview')), 1);
      render();
    });
  });
  document.getElementById('btn-cancelar-importacao')?.addEventListener('click', ()=>{
    view.importDados = null; view.importPreviewRows = null; view.importErro = null;
    render();
  });
  document.getElementById('btn-confirmar-importacao')?.addEventListener('click', async ()=>{
    const validas = view.importPreviewRows.filter(r=>r.placa);
    if(validas.length===0) return;
    view.importando = true; render();
    let sucesso = 0, falhas = 0;
    for(const r of validas){
      try{
        const novaMoto = await criarMoto(r.placa, r.modelo || 'Não informado', r.dataCompra || null, r.precoCompra || 0);
        if(r.periodicidade && r.valorParcela && r.prazo){
          await criarContrato(novaMoto.id, {
            locatario: r.locatario || 'Não informado', contato: r.contato,
            dataInicio: r.dataCompra || null, periodicidade: r.periodicidade,
            valorParcela: r.valorParcela, prazo: r.prazo,
            valorTotal: r.valorTotal || (r.valorParcela * r.prazo)
          });
        }
        sucesso++;
      }catch(err){ falhas++; console.error('Erro ao importar linha', r, err); }
    }
    view.importando = false;
    view.importDados = null; view.importPreviewRows = null;
    view.screen = 'frota';
    render();
    showAlert(`Importação concluída: ${sucesso} moto${sucesso===1?'':'s'} criada${sucesso===1?'':'s'}${falhas?`, ${falhas} com erro (veja o console)`:''}.`);
  });

  document.getElementById('btn-backup-json')?.addEventListener('click', baixarBackupJSON);
  document.getElementById('btn-backup-sql')?.addEventListener('click', baixarBackupSQL);
  document.getElementById('btn-logout')?.addEventListener('click', async ()=>{
    await sb.auth.signOut();
  });
  document.getElementById('btn-nova-moto')?.addEventListener('click', ()=>{ view.modal='nova-moto'; render(); });
  document.getElementById('btn-back')?.addEventListener('click', ()=>{ view.screen='frota'; view.motoId=null; render(); });
  document.getElementById('btn-novo-contrato')?.addEventListener('click', ()=>{ view.modal='novo-contrato'; render(); });
  document.getElementById('btn-editar-moto')?.addEventListener('click', ()=>{ view.modalCtx={motoId:view.motoId}; view.modal='editar-moto'; render(); });
  document.getElementById('btn-excluir-moto')?.addEventListener('click', ()=>{
    const moto = state.motos.find(m=>m.id===view.motoId);
    if(!moto) return;
    const qtdLanc = lancamentosDaMoto(moto.id).length;
    askConfirm(
      `Excluir a moto <b>${moto.placa}</b> de vez? Isso apaga também todos os contratos (${contratosDaMoto(moto.id).length}) e lançamentos (${qtdLanc}) dela. Essa ação não pode ser desfeita.`,
      async ()=>{
        try{
          await excluirMoto(moto.id);
          view.screen='frota'; view.motoId=null;
          render();
        }catch(err){ showAlert('Erro ao excluir: ' + err.message); }
      }
    );
  });
  document.getElementById('btn-editar-contrato')?.addEventListener('click', ()=>{
    const c = contratoAtivo(view.motoId);
    if(!c) return;
    view.modalCtx={contratoId:c.id}; view.modal='editar-contrato'; render();
  });
  document.getElementById('btn-lancamento')?.addEventListener('click', ()=>{ view.modalCtx={allowMotoSelect:false, fixedMotoId:view.motoId}; view.modal='lancamento'; render(); });
  document.getElementById('btn-lancamento-geral')?.addEventListener('click', ()=>{ view.modalCtx={allowMotoSelect:true, fixedMotoId:null}; view.modal='lancamento'; render(); });

  document.getElementById('btn-encerrar')?.addEventListener('click', ()=>{
    const c = contratoAtivo(view.motoId);
    if(!c) return;
    askConfirm(`Encerrar o contrato de <b>${c.locatario}</b> manualmente? A moto volta a ficar disponível para um novo contrato.`, ()=>{
      c.status='Encerrado'; c.avisoLido=true; c.dataEncerramento=todayISO();
      render();
      atualizarContrato(c.id, {status:'Encerrado', aviso_lido:true, data_encerramento:c.dataEncerramento});
    });
  });

  document.querySelectorAll('.tab-btn').forEach(elm=>{
    elm.addEventListener('click', ()=>{ view.screen = elm.getAttribute('data-tab'); render(); });
  });
  document.getElementById('caixa-filter')?.addEventListener('change', (e)=>{ view.caixaFilter = e.target.value; render(); });
  document.getElementById('caixa-search')?.addEventListener('input', (e)=>{ view.caixaSearch = e.target.value; render(); });
  document.getElementById('btn-clear-caixa-search')?.addEventListener('click', ()=>{ view.caixaSearch=''; render(); });

  document.getElementById('frota-search')?.addEventListener('input', (e)=>{ view.frotaSearch = e.target.value; render(); });
  document.getElementById('btn-clear-search')?.addEventListener('click', ()=>{ view.frotaSearch=''; render(); });

  document.getElementById('detail-date-from')?.addEventListener('change', (e)=>{ view.detailDateFrom = e.target.value; render(); });
  document.getElementById('detail-date-to')?.addEventListener('change', (e)=>{ view.detailDateTo = e.target.value; render(); });
  document.getElementById('btn-clear-date')?.addEventListener('click', ()=>{ view.detailDateFrom=''; view.detailDateTo=''; render(); });

  document.querySelectorAll('[data-open]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      view.screen = 'detail';
      view.motoId = elm.getAttribute('data-open');
      view.detailDateFrom = ''; view.detailDateTo = '';
      render();
    });
  });
  document.querySelectorAll('[data-ack]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const c = state.contratos.find(c=>c.id===elm.getAttribute('data-ack'));
      if(c){ c.avisoLido=true; render(); atualizarContrato(c.id, {aviso_lido:true}); }
    });
  });
  document.querySelectorAll('[data-edit-lanc]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      view.modalCtx = {lancamentoId: elm.getAttribute('data-edit-lanc')};
      view.modal = 'editar-lancamento';
      render();
    });
  });
  document.querySelectorAll('[data-del-lanc]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const id = elm.getAttribute('data-del-lanc');
      askConfirm('Excluir este lançamento? Essa ação não pode ser desfeita.', ()=>{
        state.lancamentos = state.lancamentos.filter(l=>l.id!==id);
        render();
        excluirLancamento(id);
      });
    });
  });
}

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  state.session = session;
  state.authChecked = true;
  if(session){
    await loadState();
  } else {
    render();
  }

  sb.auth.onAuthStateChange((event, newSession)=>{
    state.session = newSession;
    if(newSession){
      if(!state.loaded){ loadState(); } else { render(); }
    } else {
      // logout: limpa tudo pra não deixar dado de sessão anterior visível
      state.motos = []; state.contratos = []; state.lancamentos = [];
      state.loaded = false; state.loadError = null;
      view.screen = 'dashboard'; view.motoId = null;
      render();
    }
  });
}
boot();
</script>
</body>
</html>
